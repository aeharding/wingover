name: TestFlight

on:
  push:
    branches: [main]
    # The release ref, and the ONLY trigger that stamps `production` into the
    # settings footer: vite.config.ts derives the ring from GITHUB_REF_NAME,
    # and only a bare version tag equals package.json's version. Without this
    # every iOS build was cut from `main`, so every one of them — the App
    # Store binary included — said "beta" in Settings. Same pattern and same
    # tags `pnpm release` writes (.release-it.json) as docker.yml, which has
    # shipped the web side of this correctly all along.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
    # Only things that ship in the app: docs and unrelated workflows were
    # burning a ~10-minute macOS build per push. Branch pushes only — GitHub
    # does not evaluate `paths` for tag pushes, so a release builds whatever
    # it touched.
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      # Screenshot commits are uploaded by upload-screenshots.yml (a cheap API
      # upload); they must NOT burn a ~10-min macOS TestFlight build. `pnpm
      # screenshots` writes BOTH the store PNGs (fastlane) and the web WebP
      # (public/shots), so both output paths are excluded — the negations sit
      # after their positive globs (public/**, fastlane/**) so they win.
      - "!public/shots/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "fastlane/**"
      - "!fastlane/screenshots/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

jobs:
  testflight:
    # `pnpm release` pushes the release commit and its tag together, so both
    # refs fire on the same sha. The tag run is the release; the main run
    # would be its beta-stamped twin — a second ~10-minute macOS build of
    # identical code, uploaded under a lower build number. Skip it. The
    # message is release-it's, pinned in .release-it.json; on a tag push and
    # on workflow_dispatch there is no head_commit and this reads as true.
    if: "startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'chore: release ')"
    concurrency:
      group: ios-release
    environment: deploy
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Skips gracefully until the deploy secrets exist, so main stays green
      # while App Store Connect setup is pending.
      - name: Check deploy credentials
        id: creds
        env:
          HAS_KEY: ${{ secrets.APP_STORE_CONNECT_KEY != '' }}
        run: echo "have=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.have == 'true'
      - uses: actions/setup-node@v6
        if: steps.creds.outputs.have == 'true'
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - uses: ruby/setup-ruby@v1
        if: steps.creds.outputs.have == 'true'
        with:
          bundler-cache: true

      - name: Install iOS Rust targets
        if: steps.creds.outputs.have == 'true'
        run: rustup target add aarch64-apple-ios

      - name: Install dependencies
        if: steps.creds.outputs.have == 'true'
        run: pnpm install --frozen-lockfile

      - name: Prepare Apple API key
        if: steps.creds.outputs.have == 'true'
        run: |
          echo "$APP_STORE_CONNECT_KEY" > authkey.json
          jq -r .key authkey.json > apple-api.p8
          {
            echo "APPLE_API_ISSUER=$(jq -r .issuer_id authkey.json)"
            echo "APPLE_API_KEY=$(jq -r .key_id authkey.json)"
            echo "APPLE_API_KEY_PATH=$PWD/apple-api.p8"
          } >> "$GITHUB_ENV"
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}

      - name: Build and deploy to TestFlight
        if: steps.creds.outputs.have == 'true'
        run: bundle exec fastlane ios deploy
        env:
          VITE_MAPKIT_TOKEN_TAURI: ${{ vars.VITE_MAPKIT_TOKEN_TAURI }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # Stamped into the IPA by fastlane (--build-number) AND read by vite
          # for the settings footer, so the number a tester quotes is one
          # number. The rest of the footer's identity (ref -> release ring,
          # sha) needs no wiring: the frontend build runs inside this job and
          # inherits the runner's GITHUB_* env.
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}

      - name: Upload IPA artifact
        if: steps.creds.outputs.have == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Wingover-iOS-${{ github.run_number }}.ipa
          path: build-export/*.ipa
